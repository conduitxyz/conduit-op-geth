policy:
  approval:
    - or:
      - FORCE_COMMIT
      - pull_request
      - and:
        - review

approval_rules:
  # rule to allow for forcible commits regardless of regular review process
  # this should be only used in the event of a site-outage and oncall is responding.
  - name: FORCE_COMMIT
    if:
      changed_files:
        paths:
          - ".*"
    requires:
      count: 1
      # only some users are allowed to give this sort of commit
      teams: 
        - conduitxyz/org_engineering
        - conduitxyz/org_product_rollup
    options:
      allow_author: true
      allow_contributor: true
      methods:
        github_review: false
        comments:
          - FORCE_COMMIT

  # default rule
  - name: pull_request
    if:
      changed_files:
        paths:
          - ".*"
      has_author_in:
        teams:
          - conduitxyz/org_engineering
          - conduitxyz/org_product
          - conduitxyz/org_gtm_solutions
    requires:
      count: 0

  - name: review
    if:
      changed_files:
        paths:
          - ".*"
    requires:
      count: 1
      teams:
        - conduitxyz/org_engineering
        - conduitxyz/org_product
        - conduitxyz/org_gtm_solutions
    options:
      allow_author: false
      invalidate_on_push: true
      methods:
        github_review: true
